
name: Mizan Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Place main.dart in lib
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi

      - name: Generate Android project
        run: flutter create --platforms=android --project-name mizan_law_app .

      - name: Remove default generated test
        run: rm -rf test

      - name: Force compileSdk 36 for plugin libraries
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      if (plugins.hasPlugin("com.android.library")) {
                          extensions.findByName("android")?.withGroovyBuilder { "compileSdkVersion"(36) }
                      }
                  }
              }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects {
              if (project.name != 'app') {
                  project.afterEvaluate {
                      if (project.plugins.hasPlugin('com.android.library')) {
                          project.android { compileSdkVersion 36 }
                      }
                  }
              }
          }
          EOF
          fi

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          import os, re
          kts = 'android/app/build.gradle.kts'
          groovy = 'android/app/build.gradle'
          if os.path.exists(kts):
              s = open(kts, encoding='utf-8').read()
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  if re.search(r'compileOptions\s*\{', s):
                      s = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
                  else:
                      s = re.sub(r'(android\s*\{)', r'\1\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }', s, count=1)
                  line = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                  if re.search(r'^dependencies\s*\{', s, re.M):
                      s = re.sub(r'(^dependencies\s*\{)', r'\1\n' + line, s, count=1, flags=re.M)
                  else:
                      s += '\ndependencies {\n' + line + '\n}\n'
                  open(kts, 'w', encoding='utf-8').write(s)
          elif os.path.exists(groovy):
              s = open(groovy, encoding='utf-8').read()
              if 'coreLibraryDesugaringEnabled' not in s:
                  if re.search(r'compileOptions\s*\{', s):
                      s = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
                  else:
                      s = re.sub(r'(android\s*\{)', r'\1\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }', s, count=1)
                  line = "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'"
                  if re.search(r'^dependencies\s*\{', s, re.M):
                      s = re.sub(r'(^dependencies\s*\{)', r'\1\n' + line, s, count=1, flags=re.M)
                  else:
                      s += '\ndependencies {\n' + line + '\n}\n'
                  open(groovy, 'w', encoding='utf-8').write(s)
          PY

      - name: Allow internet, notifications and set app name
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="Fareed-app"|' android/app/src/main/AndroidManifest.xml

      - name: Generate borderless app icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image

          res = 'android/app/src/main/res'
          logo_path = 'logo2.png'

          if not os.path.exists(logo_path):
              raise FileNotFoundError("logo2.png not found")

          logo = Image.open(logo_path).convert('RGBA')

          bbox = logo.getchannel('A').getbbox()
          if bbox:
              logo = logo.crop(bbox)

          def launcher(size):
              bg = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              icon = logo.copy()
              icon.thumbnail(
                  (int(size * 0.90), int(size * 0.90)),
                  Image.LANCZOS
              )
              bg.alpha_composite(
                  icon,
                  ((size - icon.width) // 2,
                   (size - icon.height) // 2)
              )
              return bg

          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192
          }

          for density, size in sizes.items():
              folder = os.path.join(res, 'mipmap-' + density)
              os.makedirs(folder, exist_ok=True)
              launcher(size).save(
                  os.path.join(folder, 'ic_launcher.png')
              )

          # Remove adaptive icon XML so transparent PNG icons are used
          adaptive = os.path.join(res, 'mipmap-anydpi-v26')
          if os.path.isdir(adaptive):
              import shutil
              shutil.rmtree(adaptive)

          # Notification icon
          os.makedirs(res + '/drawable', exist_ok=True)
          notification = Image.new('RGBA', (96, 96), (0, 0, 0, 0))

          icon = logo.copy()
          icon.thumbnail((88, 88), Image.LANCZOS)

          white = Image.new('RGBA', icon.size, (255, 255, 255, 255))
          white.putalpha(icon.getchannel('A'))

          notification.alpha_composite(
              white,
              ((96 - icon.width) // 2,
               (96 - icon.height) // 2)
          )

          notification.save(res + '/drawable/ic_notif.png')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mizan-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
